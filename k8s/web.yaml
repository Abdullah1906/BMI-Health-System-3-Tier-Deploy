# Angular UI + nginx। nginx-এর upstream একটি ConfigMap থেকে আসে এবং API Service-কে দেখায়।
# YOUR_USERNAME নিজের Docker Hub username দিয়ে বদলাও।
apiVersion: v1
kind: ConfigMap
metadata:
  name: scaling-demo-web-upstream
data:
  upstream.conf: |
    # kube-proxy Service-এর পেছনের সব pod-এ load balance করে।
    server scaling-demo-service:80;
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: scaling-demo-web
spec:
  replicas: 2

  selector:
    matchLabels:
      app: scaling-demo-web

  template:
    metadata:
      labels:
        app: scaling-demo-web

    spec:
      containers:
        - name: web
          image: YOUR_USERNAME/scaling-demo-web:1.0

          ports:
            - containerPort: 80

          readinessProbe:
            httpGet:
              path: /
              port: 80
            periodSeconds: 5

          resources:
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              memory: 128Mi

          volumeMounts:
            - name: upstream
              mountPath: /etc/nginx/upstream.conf
              subPath: upstream.conf
              readOnly: true

      volumes:
        - name: upstream
          configMap:
            name: scaling-demo-web-upstream
---
# Lab-এর জন্য NodePort: http://<যেকোনো-node-IP>:30080
# (বিকল্প: kubectl port-forward service/scaling-demo-web 8080:80 → http://localhost:8080)
apiVersion: v1
kind: Service
metadata:
  name: scaling-demo-web

spec:
  type: NodePort

  selector:
    app: scaling-demo-web

  ports:
    - port: 80
      targetPort: 80
      nodePort: 30080
