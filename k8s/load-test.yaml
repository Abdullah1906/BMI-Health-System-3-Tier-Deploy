# /health হালকা, তাই CPU লোডের জন্য /cpu endpoint-এ হিট করা হয়েছে।
apiVersion: v1
kind: Pod
metadata:
  name: load-test
spec:
  restartPolicy: Never
  containers:
    - name: load
      image: busybox:1.36
      command:
        - sh
        - -c
        - |
          for i in 1 2 3 4; do
            (while true; do wget -q -O- "http://scaling-demo-service/cpu?ms=300" >/dev/null; done) &
          done
          wait
