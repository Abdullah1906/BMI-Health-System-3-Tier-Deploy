worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Which API instances to balance across is environment-specific, so it lives in
    # a small file that Compose / Kubernetes can replace (see upstream.conf).
    upstream api_backend {
        include /etc/nginx/upstream.conf;
    }

    server {
        listen 80;
        root   /usr/share/nginx/html;
        index  index.html;

        # The API plus the lab's probe endpoints go to the backend.
        location ~ ^/(api|health|instance|cpu)(/|$) {
            proxy_pass http://api_backend;
            proxy_http_version 1.1;

            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Angular build output has content hashes in file names, so cache it hard.
        location ~* \.(?:js|css|woff2?|svg|png|jpg|ico)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
            try_files $uri =404;
        }

        # Single-page app: unknown paths fall back to index.html.
        location / {
            add_header Cache-Control "no-cache";
            try_files $uri $uri/ /index.html;
        }
    }
}
