# Step 4 — Step 3-এর সাথে cAdvisor + Prometheus + Grafana।
#   App: http://localhost:8088   Prometheus: http://localhost:9090   Grafana: http://localhost:3000
# এটি Linux Docker host-এর lab configuration; Docker Desktop-এ host-level metrics সীমিত হতে পারে।
services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "${MSSQL_SA_PASSWORD:-Lab_Passw0rd!}"
    volumes:
      - mssql-data:/var/opt/mssql
    restart: unless-stopped

  api1: &api
    image: scaling-demo-api:1.0
    build:
      context: ../../src/ScalingDemo.Api
    environment:
      ConnectionStrings__BmiDb: "Server=sqlserver,1433;Database=BmiDb;User Id=sa;Password=${MSSQL_SA_PASSWORD:-Lab_Passw0rd!};Encrypt=True;TrustServerCertificate=True"
    expose:
      - "8080"
    depends_on:
      - sqlserver
    restart: unless-stopped

  api2:
    <<: *api

  api3:
    <<: *api

  web:
    image: scaling-demo-web:1.0
    build:
      context: ../../src/ScalingDemo.Web
    ports:
      - "8088:80"
    volumes:
      - ../step3-nginx/nginx/upstream.conf:/etc/nginx/upstream.conf:ro
    depends_on:
      - api1
      - api2
      - api3
    restart: unless-stopped

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.52.1
    privileged: true
    devices:
      - /dev/kmsg:/dev/kmsg
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker:/var/lib/docker:ro
      - /dev/disk:/dev/disk:ro
    expose:
      - "8080"
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v3.5.0
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
    ports:
      - "9090:9090"
    restart: unless-stopped

  grafana:
    image: grafana/grafana:12.1.1
    ports:
      - "3000:3000"
    volumes:
      - grafana-data:/var/lib/grafana
    restart: unless-stopped

volumes:
  mssql-data:
  prometheus-data:
  grafana-data:
